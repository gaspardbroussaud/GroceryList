<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Recettes">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Mes Recettes</title>
<style>
:root {
  --bg:        #F2F2F7;
  --bg2:       #FFFFFF;
  --bg3:       #F2F2F7;
  --grouped:   #FFFFFF;
  --separator: rgba(60,60,67,0.18);
  --separator2:rgba(60,60,67,0.08);
  --text:      #000000;
  --text2:     rgba(60,60,67,0.6);
  --text3:     rgba(60,60,67,0.3);
  --blue:      #007AFF;
  --red:       #FF3B30;
  --green:     #34C759;
  --orange:    #FF9500;
  --safe-top:  env(safe-area-inset-top, 0px);
  --safe-bot:  env(safe-area-inset-bottom, 0px);
  --nav-h:     49px;
  --font:      -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:        #1C1C1E;
    --bg2:       #2C2C2E;
    --bg3:       #1C1C1E;
    --grouped:   #2C2C2E;
    --separator: rgba(84,84,88,0.65);
    --separator2:rgba(84,84,88,0.3);
    --text:      #FFFFFF;
    --text2:     rgba(235,235,245,0.6);
    --text3:     rgba(235,235,245,0.3);
    --blue:      #0A84FF;
    --red:       #FF453A;
    --green:     #32D74B;
    --orange:    #FF9F0A;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 17px;
  line-height: 1.3;
  -webkit-font-smoothing: antialiased;
}

/* ── Layout ── */
#app { display: flex; flex-direction: column; height: 100%; }

.screen { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; display: none; background: var(--bg); }
.screen.active { display: block; }
.screens { flex: 1; overflow: hidden; position: relative; }

/* ── Large title header (iOS style) ── */
.header {
  background: var(--bg);
  padding: calc(var(--safe-top) + 8px) 16px 0;
  flex-shrink: 0;
  border-bottom: 0.5px solid var(--separator);
}
.header-inner {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding-bottom: 8px;
}
.header-title {
  font-size: 34px;
  font-weight: 700;
  letter-spacing: 0.012em;
  color: var(--text);
  line-height: 1;
}
.header-actions { display: flex; gap: 4px; align-items: center; }
.header-btn {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--bg2);
  border: none;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--blue);
  font-size: 20px;
  font-weight: 400;
}
.header-btn:active { opacity: 0.5; }
.sync-spinning { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Tab bar ── */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: calc(var(--nav-h) + var(--safe-bot));
  background: rgba(249,249,249,0.94);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 0.5px solid var(--separator);
  display: flex;
  padding-bottom: var(--safe-bot);
  z-index: 100;
}
@media (prefers-color-scheme: dark) {
  .tabbar { background: rgba(29,29,31,0.94); }
}
.tab-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; background: none; border: none; cursor: pointer;
  font-family: var(--font); font-size: 10px; font-weight: 500;
  color: var(--text3); padding: 4px 0; position: relative;
  transition: color 0.1s;
}
.tab-btn.active { color: var(--blue); }
.tab-icon { font-size: 22px; line-height: 1; }
.tab-badge {
  position: absolute; top: 4px; right: calc(50% - 18px);
  background: var(--red); color: #fff;
  font-size: 11px; font-weight: 600;
  min-width: 18px; height: 18px;
  border-radius: 9px; padding: 0 5px;
  display: flex; align-items: center; justify-content: center;
}

/* ── Grouped list (iOS Reminders style) ── */
.list-section { margin: 20px 16px 0; }
.list-section-title {
  font-size: 13px; font-weight: 600; color: var(--text2);
  text-transform: uppercase; letter-spacing: 0.06em;
  margin-bottom: 8px; padding-left: 4px;
}
.list-group {
  background: var(--grouped);
  border-radius: 12px;
  overflow: hidden;
}
.list-row {
  display: flex; align-items: center;
  min-height: 52px;
  padding: 10px 16px;
  position: relative;
  cursor: pointer;
}
.list-row:active { background: var(--separator2); }
.list-row + .list-row::before {
  content: '';
  position: absolute; top: 0; left: 56px; right: 0;
  height: 0.5px; background: var(--separator);
}
.row-check {
  width: 26px; height: 26px; border-radius: 50%;
  border: 2px solid var(--separator);
  flex-shrink: 0; margin-right: 14px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.row-check.checked {
  background: var(--blue); border-color: var(--blue);
}
.row-check.checked::after {
  content: '';
  width: 12px; height: 7px;
  border-left: 2px solid #fff;
  border-bottom: 2px solid #fff;
  transform: rotate(-45deg) translate(1px, -1px);
  display: block;
}
.row-content { flex: 1; min-width: 0; }
.row-title { font-size: 17px; font-weight: 400; color: var(--text); }
.row-sub { font-size: 13px; color: var(--text2); margin-top: 1px; }
.row-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.row-chevron { color: var(--text3); font-size: 14px; font-weight: 600; }
.row-actions { display: flex; gap: 6px; margin-top: 8px; }

/* ── Quantity badge ── */
.qty-badge {
  font-size: 15px; font-weight: 500; color: var(--blue);
  background: rgba(0,122,255,0.1);
  padding: 2px 8px; border-radius: 6px;
}
@media (prefers-color-scheme: dark) {
  .qty-badge { background: rgba(10,132,255,0.15); }
}

/* ── iOS-style action buttons ── */
.ios-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 7px 14px; border-radius: 8px;
  font-family: var(--font); font-size: 15px; font-weight: 500;
  border: none; cursor: pointer; transition: opacity 0.1s;
}
.ios-btn:active { opacity: 0.6; }
.ios-btn-blue { background: rgba(0,122,255,0.12); color: var(--blue); }
.ios-btn-red { background: rgba(255,59,48,0.1); color: var(--red); }
.ios-btn-plain { background: var(--bg2); color: var(--text2); border: 0.5px solid var(--separator); }
.ios-btn-primary { background: var(--blue); color: #fff; }
.ios-btn-block { width: 100%; }
@media (prefers-color-scheme: dark) {
  .ios-btn-blue { background: rgba(10,132,255,0.2); }
  .ios-btn-red { background: rgba(255,69,58,0.2); }
}

/* ── FAB (Add button) ── */
.fab {
  position: fixed;
  bottom: calc(var(--nav-h) + var(--safe-bot) + 20px);
  right: 20px;
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--blue); color: #fff;
  border: none; font-size: 28px; font-weight: 300;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 20px rgba(0,122,255,0.4);
  cursor: pointer; z-index: 99;
  transition: transform 0.15s;
}
.fab:active { transform: scale(0.9); }

/* ── Empty state ── */
.empty-state {
  text-align: center;
  padding: 80px 32px 40px;
  color: var(--text3);
}
.empty-state-icon { font-size: 56px; margin-bottom: 16px; opacity: 0.5; }
.empty-state-title { font-size: 22px; font-weight: 600; color: var(--text2); margin-bottom: 8px; }
.empty-state-sub { font-size: 15px; color: var(--text3); line-height: 1.5; }

/* ── Shopping item ── */
.shop-row {
  display: flex; align-items: center;
  min-height: 52px; padding: 10px 16px;
  position: relative; cursor: pointer;
}
.shop-row:active { background: var(--separator2); }
.shop-row + .shop-row::before {
  content: ''; position: absolute; top: 0; left: 56px; right: 0;
  height: 0.5px; background: var(--separator);
}
.shop-circle {
  width: 22px; height: 22px; border-radius: 50%;
  border: 1.5px solid var(--blue); flex-shrink: 0;
  margin-right: 14px; transition: all 0.2s;
}
.shop-row.done .shop-circle {
  background: var(--text3); border-color: var(--text3);
}
.shop-name { flex: 1; font-size: 17px; }
.shop-row.done .shop-name { text-decoration: line-through; color: var(--text3); }
.shop-qty-txt { font-size: 15px; font-weight: 500; color: var(--text2); }
.shop-unit-txt { font-size: 13px; color: var(--text3); margin-left: 3px; }
.shop-row.done .shop-qty-txt,
.shop-row.done .shop-unit-txt { color: var(--text3); }

/* ── Modal sheet ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 200; display: flex; flex-direction: column; justify-content: flex-end;
}
.modal-overlay.hidden { display: none; }
.modal-sheet {
  background: var(--bg);
  border-radius: 12px 12px 0 0;
  padding: 0 16px calc(var(--safe-bot) + 24px);
  max-height: 94vh; overflow-y: auto;
  animation: slideUp 0.28s cubic-bezier(0.32,0.72,0,1);
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-handle {
  width: 36px; height: 5px;
  background: var(--separator);
  border-radius: 3px;
  margin: 10px auto 16px;
}
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px;
}
.modal-title { font-size: 17px; font-weight: 600; color: var(--text); }
.modal-cancel { font-size: 17px; color: var(--blue); background: none; border: none; cursor: pointer; }
.modal-cancel:active { opacity: 0.5; }

/* ── Form ── */
.form-section { margin-bottom: 20px; }
.form-label {
  font-size: 13px; font-weight: 600; color: var(--text2);
  text-transform: uppercase; letter-spacing: 0.06em;
  margin-bottom: 6px; padding-left: 4px;
}
.form-group {
  background: var(--grouped); border-radius: 12px; overflow: hidden;
}
.form-row {
  display: flex; align-items: center;
  min-height: 44px; padding: 6px 14px;
  position: relative;
}
.form-row + .form-row::before {
  content: ''; position: absolute; top: 0; left: 14px; right: 0;
  height: 0.5px; background: var(--separator);
}
.form-row-label { font-size: 15px; color: var(--text); width: 80px; flex-shrink: 0; }
input, select, textarea {
  flex: 1; font-family: var(--font); font-size: 17px; color: var(--text);
  background: none; border: none; outline: none; appearance: none;
  padding: 0; width: 100%;
}
select { background-image: none; }
input::placeholder { color: var(--text3); }
.standalone-input {
  background: var(--grouped); border-radius: 12px;
  padding: 12px 14px; font-size: 17px; color: var(--text);
  font-family: var(--font); border: none; outline: none; width: 100%;
}
.standalone-input::placeholder { color: var(--text3); }

/* ── Ingredient rows in form ── */
.ingr-item {
  display: flex; align-items: center;
  min-height: 48px; padding: 8px 14px;
  position: relative;
}
.ingr-item + .ingr-item::before {
  content: ''; position: absolute; top: 0; left: 44px; right: 0;
  height: 0.5px; background: var(--separator);
}
.ingr-del {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--red); border: none;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 14px; font-weight: 400;
  cursor: pointer; flex-shrink: 0; margin-right: 12px;
}
.ingr-del:active { opacity: 0.6; }
.ingr-edit-btn {
  width: 28px; height: 28px; border-radius: 6px;
  background: rgba(0,122,255,0.1); border: none;
  color: var(--blue); font-size: 13px;
  cursor: pointer; flex-shrink: 0; margin-left: 8px;
}
.ingr-name-txt { flex: 1; font-size: 16px; }
.ingr-qty-txt { font-size: 15px; color: var(--text2); font-weight: 500; margin-right: 4px; }
.ingr-unit-txt { font-size: 13px; color: var(--text3); }

/* ── Settings ── */
.settings-info { font-size: 13px; color: var(--text3); padding: 8px 4px 0; line-height: 1.5; }

/* ── Courses header bar ── */
.screen-topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px 0;
  margin-bottom: 4px;
}
.topbar-count { font-size: 13px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; }
.topbar-actions { display: flex; gap: 8px; }

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: calc(var(--nav-h) + var(--safe-bot) + 12px);
  left: 50%; transform: translateX(-50%);
  background: rgba(50,50,50,0.92);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  color: #fff; padding: 10px 18px;
  border-radius: 20px; font-size: 14px; font-weight: 500;
  z-index: 300; white-space: nowrap; pointer-events: none;
  animation: toastIn 0.2s ease; transition: opacity 0.3s;
}
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(6px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

/* ── Screen padding ── */
.screen-content { padding-bottom: calc(var(--nav-h) + var(--safe-bot) + 24px); }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-inner">
      <div class="header-title" id="page-title">Recettes</div>
      <div class="header-actions">
        <button class="header-btn" id="sync-btn" onclick="syncNow()" title="Synchroniser">↻</button>
        <button class="header-btn" onclick="goTo('settings')" title="Réglages">⚙</button>
      </div>
    </div>
  </div>
  <div class="screens">
    <div class="screen active" id="screen-recettes"></div>
    <div class="screen" id="screen-courses"></div>
    <div class="screen" id="screen-settings"></div>
  </div>
  <nav class="tabbar">
    <button class="tab-btn active" id="nav-recettes" onclick="goTo('recettes')">
      <span class="tab-icon">🍽</span>
      Recettes
    </button>
    <button class="tab-btn" id="nav-courses" onclick="goTo('courses')" style="position:relative">
      <span class="tab-icon">🛒</span>
      Courses
      <span class="tab-badge" id="badge" style="display:none">0</span>
    </button>
  </nav>
</div>

<!-- Modal -->
<div class="modal-overlay hidden" id="modal" onclick="closeModal(event)">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title" id="modal-title"></div>
      <button class="modal-cancel" onclick="closeModal()">Annuler</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const UNITS = ['g','kg','ml','L','cl','tsp','tbsp','tasse','unité(s)','tranche(s)','pincée(s)'];
const GH_OWNER = 'gaspardbroussaud';
const GH_REPO  = 'GroceryList';
const GH_FILE  = 'recettes.json';
const GH_API   = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}?ref=data`;

let recipes = [], selected = new Set(), ghSha = null;
let currentScreen = 'recettes', editingId = null, tmpIngredients = [], crossedItems = new Set();

const getToken = () => localStorage.getItem('gh_token') || '';
const setToken = t => localStorage.setItem('gh_token', t.trim());

// ── GitHub ────────────────────────────────────────────────────────────────
const RAW_URL = `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/data/${GH_FILE}`;
const GH_HEADERS = () => ({
  Authorization: `Bearer ${getToken()}`,
  'X-GitHub-Api-Version': '2022-11-28',
  'Content-Type': 'application/json'
});

async function loadFromGitHub() {
  try {
    if (!getToken()) return false;
    const r = await fetch(RAW_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const json = await r.json();
    recipes = json.recipes || [];
    const meta = await fetch(GH_API, { headers: GH_HEADERS() });
    if (meta.ok) { const m = await meta.json(); ghSha = m.sha; }
    return true;
  } catch(e) { console.error('loadFromGitHub', e); return false; }
}

async function saveToGitHub() {
  if (!getToken()) return false;
  try {
    const jsonStr = JSON.stringify({ recipes }, null, 2);
    const bytes = new TextEncoder().encode(jsonStr);
    let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
    const content = btoa(bin);
    const body = { message: 'Mise a jour recettes', content, branch: 'data', ...(ghSha ? { sha: ghSha } : {}) };
    const r = await fetch(GH_API, { method: 'PUT', headers: GH_HEADERS(), body: JSON.stringify(body) });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    ghSha = data.content.sha;
    return true;
  } catch(e) { console.error('saveToGitHub', e); return false; }
}

async function syncNow() {
  const btn = document.getElementById('sync-btn');
  btn.classList.add('sync-spinning');
  const ok = await loadFromGitHub();
  btn.classList.remove('sync-spinning');
  showToast(ok ? '✓ Synchronisé' : '✗ Erreur — vérifiez le token');
  if (ok) render();
}

// ── Local ─────────────────────────────────────────────────────────────────
function loadLocal() {
  try { selected = new Set(JSON.parse(localStorage.getItem('selected') || '[]')); } catch(e) { selected = new Set(); }
}

async function save() {
  localStorage.setItem('selected', JSON.stringify([...selected]));
  const btn = document.getElementById('sync-btn');
  btn.classList.add('sync-spinning');
  const ok = await saveToGitHub();
  btn.classList.remove('sync-spinning');
  if (!ok && getToken()) showToast('✗ Sauvegarde échouée');
}

// ── Toast ──────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 2400);
}

// ── Routing ────────────────────────────────────────────────────────────────
const TITLES = { recettes: 'Recettes', courses: 'Courses', settings: 'Réglages' };

function goTo(screen) {
  currentScreen = screen;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-'+screen).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  const nb = document.getElementById('nav-'+screen); if (nb) nb.classList.add('active');
  document.getElementById('page-title').textContent = TITLES[screen] || '';
  render();
}

function fmtQty(n) { return Number.isInteger(n) ? String(n) : parseFloat(Number(n).toFixed(2)).toString(); }

function computeShopping() {
  const map = {};
  recipes.filter(r => selected.has(r.id)).forEach(r => {
    r.ingredients.forEach(ing => {
      const key = ing.name.toLowerCase().trim()+'|'+ing.unit;
      if (!map[key]) map[key] = { name: ing.name, qty: 0, unit: ing.unit };
      map[key].qty += Number(ing.qty);
    });
  });
  return Object.values(map).sort((a,b) => a.name.localeCompare(b.name));
}

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  updateBadge();
  if (currentScreen === 'recettes') renderRecettes();
  else if (currentScreen === 'courses') renderCourses();
  else renderSettings();
}

function updateBadge() {
  const cnt = [...selected].filter(id => recipes.find(r => r.id===id)).length;
  const b = document.getElementById('badge');
  b.style.display = cnt > 0 ? 'flex' : 'none';
  b.textContent = cnt;
}

function renderRecettes() {
  document.querySelectorAll('.fab').forEach(f => f.remove());
  const el = document.getElementById('screen-recettes');

  if (recipes.length === 0) {
    el.innerHTML = `<div class="empty-state screen-content">
      <div class="empty-state-icon">🍽️</div>
      <div class="empty-state-title">Aucune recette</div>
      <div class="empty-state-sub">Appuyez sur + pour ajouter votre première recette.</div>
    </div>`;
  } else {
    const sel = [...selected].filter(id => recipes.find(r=>r.id===id)).length;
    el.innerHTML = `<div class="screen-content">
      <div class="list-section">
        ${sel > 0 ? `<div class="list-section-title">${sel} sélectionnée${sel>1?'s':''}</div>` : `<div class="list-section-title">Mes recettes</div>`}
        <div class="list-group">
          ${recipes.map(r => `
          <div class="list-row" onclick="toggleSelect('${r.id}')">
            <div class="row-check ${selected.has(r.id)?'checked':''}"></div>
            <div class="row-content">
              <div class="row-title">${r.name}</div>
              <div class="row-sub">${r.ingredients.length} ingrédient${r.ingredients.length>1?'s':''}</div>
            </div>
            <div class="row-right" onclick="event.stopPropagation()">
              <button class="ios-btn ios-btn-blue" style="padding:5px 10px;font-size:13px" onclick="openEdit('${r.id}')">Modifier</button>
              <button class="ios-btn ios-btn-red" style="padding:5px 10px;font-size:13px" onclick="deleteRecipe('${r.id}')">Supprimer</button>
            </div>
          </div>`).join('')}
        </div>
      </div>
    </div>`;
  }

  const fab = document.createElement('button');
  fab.className = 'fab'; fab.innerHTML = '+'; fab.onclick = openAdd;
  document.body.appendChild(fab);
}

function renderCourses() {
  document.querySelectorAll('.fab').forEach(f => f.remove());
  const el = document.getElementById('screen-courses');
  const items = computeShopping();

  if (selected.size === 0) {
    el.innerHTML = `<div class="empty-state screen-content">
      <div class="empty-state-icon">🛒</div>
      <div class="empty-state-title">Aucune recette sélectionnée</div>
      <div class="empty-state-sub">Allez dans Recettes et sélectionnez celles que vous souhaitez cuisiner.</div>
    </div>`;
    return;
  }

  const done = items.filter(it => crossedItems.has(it.name+'|'+it.unit)).length;
  const remaining = items.length - done;

  el.innerHTML = `<div class="screen-content">
    <div class="screen-topbar">
      <div class="topbar-count">${remaining} article${remaining!==1?'s':''} restant${remaining!==1?'s':''}</div>
      <div class="topbar-actions">
        ${done > 0 ? `<button class="ios-btn ios-btn-plain" style="font-size:13px;padding:5px 12px" onclick="clearCrossed()">Effacer cochés</button>` : ''}
        <button class="ios-btn ios-btn-blue" style="font-size:13px;padding:5px 12px" onclick="copyList()" id="copy-btn">📋 Copier</button>
      </div>
    </div>
    <div class="list-section" style="margin-top:8px">
      <div class="list-group">
        ${items.map(it => {
          const key = it.name+'|'+it.unit;
          const x = crossedItems.has(key);
          return `<div class="shop-row ${x?'done':''}" onclick="toggleCross('${key}')">
            <div class="shop-circle"></div>
            <span class="shop-name">${it.name}</span>
            <span class="shop-qty-txt">${fmtQty(it.qty)}</span>
            <span class="shop-unit-txt">${it.unit}</span>
          </div>`;
        }).join('')}
      </div>
    </div>
  </div>`;
}

function copyList() {
  const items = computeShopping();
  const text = items.map(it => `${it.name} ${fmtQty(it.qty)} ${it.unit}`).join('\n');
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copy-btn');
    if (btn) { btn.textContent = '✓ Copié'; setTimeout(() => { btn.innerHTML = '📋 Copier'; }, 2000); }
  }).catch(() => showToast('Copie non supportée'));
}

function renderSettings() {
  document.querySelectorAll('.fab').forEach(f => f.remove());
  const token = getToken(), has = token.length > 0;
  document.getElementById('screen-settings').innerHTML = `<div class="screen-content">
    <div class="list-section">
      <div class="list-section-title">Synchronisation GitHub</div>
      <div class="list-group">
        <div class="list-row" style="cursor:default">
          <div class="row-content"><div class="row-title">Dépôt</div></div>
          <div style="font-size:15px;color:var(--text2)">${GH_OWNER}/${GH_REPO}</div>
        </div>
        <div class="list-row" style="cursor:default">
          <div class="row-content"><div class="row-title">Statut</div></div>
          <div style="font-size:15px;color:${has?'var(--green)':'var(--text3)'}">${has?'Connecté':'Non configuré'}</div>
        </div>
      </div>
    </div>

    <div class="list-section">
      <div class="list-section-title">Token d'accès</div>
      <div class="form-group">
        <div class="form-row">
          <input type="password" id="token-input" placeholder="ghp_..." value="${token}" autocomplete="off">
        </div>
      </div>
      <div class="settings-info">GitHub → Settings → Developer settings → Personal access tokens (Classic) → permission <strong>repo</strong>. Stocké uniquement sur cet appareil.</div>
    </div>

    <div class="list-section">
      <button class="ios-btn ios-btn-primary ios-btn-block" onclick="saveToken()" style="margin-bottom:10px;padding:13px">Enregistrer le token</button>
      ${has ? `
      <button class="ios-btn ios-btn-plain ios-btn-block" onclick="syncNow().then(render)" style="margin-bottom:10px;padding:13px">↻ Synchroniser</button>
      <button class="ios-btn ios-btn-red ios-btn-block" onclick="clearToken()" style="padding:13px">Supprimer le token</button>` : ''}
    </div>
  </div>`;
}

function saveToken() {
  const val = document.getElementById('token-input').value.trim();
  if (!val) { showToast('Token vide'); return; }
  setToken(val); showToast('✓ Token enregistré');
  syncNow().then(() => render());
}
function clearToken() { localStorage.removeItem('gh_token'); ghSha=null; showToast('Token supprimé'); render(); }

// ── Actions ────────────────────────────────────────────────────────────────
function toggleSelect(id) {
  if (selected.has(id)) selected.delete(id); else selected.add(id);
  localStorage.setItem('selected', JSON.stringify([...selected])); render();
}
function toggleCross(key) {
  if (crossedItems.has(key)) crossedItems.delete(key); else crossedItems.add(key);
  renderCourses();
}
function clearCrossed() { crossedItems.clear(); renderCourses(); }
function deleteRecipe(id) {
  if (!confirm('Supprimer cette recette ?')) return;
  recipes = recipes.filter(r=>r.id!==id); selected.delete(id);
  save().then(()=>render());
}

// ── Modal ──────────────────────────────────────────────────────────────────
let editingIngrIdx = null;

function openAdd() {
  editingId=null; tmpIngredients=[]; editingIngrIdx=null;
  document.getElementById('modal-title').textContent='Nouvelle recette';
  renderModalBody(''); showModal();
}
function openEdit(id) {
  const r=recipes.find(r=>r.id===id); editingId=id;
  tmpIngredients=r.ingredients.map(i=>({...i})); editingIngrIdx=null;
  document.getElementById('modal-title').textContent='Modifier la recette';
  renderModalBody(r.name); showModal();
}

function renderModalBody(name) {
  document.getElementById('modal-body').innerHTML=`
    <div class="form-section">
      <div class="form-label">Nom</div>
      <input class="standalone-input" id="recipe-name" placeholder="Nom de la recette" value="${name}" autocomplete="off">
    </div>

    <div class="form-section">
      <div class="form-label">Ingrédients</div>
      <div class="list-group" id="ingr-list"></div>
    </div>

    <div class="form-section">
      <div class="form-label">Ajouter un ingrédient</div>
      <div class="form-group" style="margin-bottom:10px">
        <div class="form-row">
          <input id="new-ingr-name" placeholder="Nom" autocomplete="off">
        </div>
        <div class="form-row">
          <div class="form-row-label" style="color:var(--text2);font-size:15px">Quantité</div>
          <input id="new-ingr-qty" type="number" min="0" step="any" placeholder="0">
        </div>
        <div class="form-row">
          <div class="form-row-label" style="color:var(--text2);font-size:15px">Unité</div>
          <select id="new-ingr-unit" style="color:var(--text);font-size:17px">${UNITS.map(u=>`<option>${u}</option>`).join('')}</select>
        </div>
      </div>
      <button class="ios-btn ios-btn-blue ios-btn-block" style="padding:12px" onclick="addIngr()">+ Ajouter</button>
    </div>

    <div class="form-section">
      <button class="ios-btn ios-btn-primary ios-btn-block" style="padding:13px;margin-bottom:10px" onclick="saveRecipe()">
        ${editingId ? 'Enregistrer' : 'Créer la recette'}
      </button>
    </div>`;
  refreshIngrList();
}

function refreshIngrList() {
  const el = document.getElementById('ingr-list');
  if (tmpIngredients.length === 0) {
    el.innerHTML = `<div style="padding:14px 16px;font-size:15px;color:var(--text3);text-align:center">Aucun ingrédient</div>`;
    return;
  }
  el.innerHTML = tmpIngredients.map((ing, i) => editingIngrIdx===i ? `
    <div class="ingr-item" style="flex-direction:column;align-items:stretch;gap:8px;padding:12px 14px">
      <input class="standalone-input" id="edit-ingr-name" value="${ing.name}" placeholder="Ingrédient" autocomplete="off" style="margin-bottom:0">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <input class="standalone-input" id="edit-ingr-qty" type="number" min="0" step="any" value="${ing.qty}">
        <select class="standalone-input" id="edit-ingr-unit" style="padding:12px 10px">${UNITS.map(u=>`<option ${u===ing.unit?'selected':''}>${u}</option>`).join('')}</select>
      </div>
      <div style="display:flex;gap:8px">
        <button class="ios-btn ios-btn-primary" style="flex:1;padding:10px;justify-content:center" onclick="saveIngrEdit(${i})">✓ OK</button>
        <button class="ios-btn ios-btn-plain" style="flex:1;padding:10px;justify-content:center" onclick="cancelIngrEdit()">Annuler</button>
      </div>
    </div>` : `
    <div class="ingr-item">
      <button class="ingr-del" onclick="removeIngr(${i})">−</button>
      <span class="ingr-name-txt">${ing.name}</span>
      <span class="ingr-qty-txt">${fmtQty(ing.qty)}</span>
      <span class="ingr-unit-txt">${ing.unit}</span>
      <button class="ingr-edit-btn" onclick="editIngr(${i})">✏</button>
    </div>`
  ).join('');
}

function editIngr(i) { editingIngrIdx=i; refreshIngrList(); }
function cancelIngrEdit() { editingIngrIdx=null; refreshIngrList(); }
function saveIngrEdit(i) {
  const name=document.getElementById('edit-ingr-name').value.trim();
  const qty=parseFloat(document.getElementById('edit-ingr-qty').value);
  const unit=document.getElementById('edit-ingr-unit').value;
  if (!name||isNaN(qty)||qty<=0) { showToast('Remplissez le nom et la quantité'); return; }
  tmpIngredients[i]={name,qty,unit}; editingIngrIdx=null; refreshIngrList();
}
function addIngr() {
  const name=document.getElementById('new-ingr-name').value.trim();
  const qty=parseFloat(document.getElementById('new-ingr-qty').value);
  const unit=document.getElementById('new-ingr-unit').value;
  if (!name||isNaN(qty)||qty<=0) { showToast('Remplissez le nom et la quantité'); return; }
  tmpIngredients.push({name,qty,unit});
  document.getElementById('new-ingr-name').value='';
  document.getElementById('new-ingr-qty').value='';
  document.getElementById('new-ingr-name').focus();
  refreshIngrList();
}
function removeIngr(i) { tmpIngredients.splice(i,1); editingIngrIdx=null; refreshIngrList(); }
function saveRecipe() {
  const name=document.getElementById('recipe-name').value.trim();
  if (!name) { showToast('Donnez un nom à la recette'); return; }
  if (tmpIngredients.length===0) { showToast('Ajoutez au moins un ingrédient'); return; }
  if (editingId) recipes=recipes.map(r=>r.id===editingId?{...r,name,ingredients:tmpIngredients}:r);
  else recipes.push({id:Date.now().toString(),name,ingredients:tmpIngredients});
  save().then(()=>{ closeModal(); render(); });
}

function showModal() { document.getElementById('modal').classList.remove('hidden'); }
function closeModal(e) {
  if (e && e.target !== document.getElementById('modal')) return;
  document.getElementById('modal').classList.add('hidden');
}
window.closeModal = closeModal;

// ── Boot ───────────────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) window.addEventListener('load', ()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));

loadLocal();
render();
if (getToken()) {
  loadFromGitHub().then(ok => {
    if (ok) { render(); }
    else { showToast('✗ Impossible de charger les recettes'); }
  });
}
</script>
</body>
</html>
